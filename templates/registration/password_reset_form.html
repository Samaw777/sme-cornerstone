{% extends "auth.html" %}
{% load ui %}

{% block title %}Reset password · SME Cornerstone{% endblock %}

{% block content %}
<h1>Reset <em>password</em></h1>
<p class="lede">Enter your email and we'll send you a link to set a new password.</p>
<form method="post" class="form">
  {% csrf_token %}
  <div class="field"><label class="label" for="id_email">Email</label>
    <input type="email" id="id_email" name="email" value="{{ form.email.value|default:'' }}" placeholder="you@example.com" autocomplete="email" required autofocus></div>
  {% include "registration/_errors.html" %}
  <button type="submit" class="btn btn-primary btn-lg">Send reset link {% icon "arrow-right" 18 %}</button>
</form>
<p class="auth-switch"><a href="{% url 'login' %}">Back to sign in</a></p>
{% endblock %}
